name: account_app
description: Complete Account Management App with Auto Sync
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0

  # Database & Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Firebase
  firebase_core: ^4.2.1
  cloud_firestore: ^6.1.0
  firebase_auth: ^6.1.2
  firebase_messaging: ^16.0.4
  firebase_storage: ^13.0.4

  # State Management
  provider: ^6.1.2

  # UI & Utilities
  flutter_localizations:
    sdk: flutter
  image_picker: ^1.1.2
  image_cropper: ^8.0.2
  url_launcher: ^6.3.0
  http: ^1.2.1
  share_plus: ^12.0.1
  connectivity_plus: ^7.0.0
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  intl: ^0.20.2
  crypto: ^3.0.3
  encrypt: ^5.0.3
  permission_handler: ^12.0.1
  audioplayers: ^6.0.0
  record: ^5.0.5
  local_auth: ^3.0.0
  device_info_plus: ^12.2.0
  flutter_contacts: ^1.1.9
  photo_view: ^0.15.0
  phosphor_flutter: ^2.1.0

  # PDF & Printing
  pdf: ^3.10.8
  printing: ^5.12.0
  # arabic_reshaper removed due to resolution error
  
  # Excel
  csv: ^6.0.0

  # Charts
  fl_chart: ^1.1.1

  # Notifications
  flutter_local_notifications: ^19.5.0
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1
  package_info_plus: ^8.0.0
  screenshot: ^3.0.0
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^5.1.0
  palette_generator: ^0.3.3+7
  mobile_scanner: ^5.2.1
  uuid: ^4.3.3


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.9
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icons/zalooq.png"

  min_sdk_android: 21

# Temporary override to fix dependency conflict in record_linux
dependency_overrides:
  record_linux: ^1.2.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - .env
    - assets/images/
    - assets/images/icons/
    - assets/fonts/

  fonts:
    - family: NooriNastaleeq
      fonts:
        - asset: assets/fonts/NooriNastaleeq.ttf
    - family: Gulzar
      fonts:
        - asset: assets/fonts/GulzarRegular.ttf
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700
